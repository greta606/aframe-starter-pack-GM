<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#f5f3e4"></a-sphere>
      <a-sphere position="0 3 -5" radius="1" color="#f5f3e4"></a-sphere>
      <a-sphere position="0 4.5 -5" radius="0.75" color="#f5f3e4"></a-sphere>
      <a-sphere position="-0.4 4.5 -4.35" radius="0.1" color="#000000"></a-sphere>
      <a-sphere position="0.4 4.5 -4.35" radius="0.1" color="#000000"></a-sphere>
      <a-cone position="0 4.4 -4" radius-bottom="0.1" color="#e87c00" rotation="90 0 0"></a-cone>
      <a-sphere position="0 3.4 -4.1" radius="0.1" color="#000000"></a-sphere>
      <a-sphere position="0 3 -4" radius="0.1" color="#000000"></a-sphere>
      <a-sphere position="0 2.6 -4.1" radius="0.1" color="#000000"></a-sphere>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: yavapai; dressingAmount: 500"></a-entity>
    </a-scene>
  </body>
</html>
